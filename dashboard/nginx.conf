# Serves the built dashboard. Port 8080 because the unprivileged nginx image runs
# as uid 101 and cannot bind a port below 1024.

# nginx's add_header does not merge: a location with its own add_header drops every
# header inherited from the server block. Rather than repeat the security headers in
# each location, the one header that differs per path is chosen here, so all of them
# can live in a single place.
map $uri $cache_control {
    # Vite puts a content hash in every asset filename, so an asset never changes
    # under the same name and can be cached for a year.
    ~^/assets/  "public, max-age=31536000, immutable";

    # Everything else is index.html, which points at the hashed assets. A cached copy
    # would keep serving the previous deploy.
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;

    # Stop announcing the exact nginx version in every response: knowing it makes it
    # cheap to look up vulnerabilities for this specific build.
    server_tokens off;

    # Redirects go out as a path, not a full URL. nginx would otherwise build one from
    # this server's own name and port 8080, which is neither the scheme nor the port
    # the client reached us on through Traefik.
    absolute_redirect off;

    # Compress text responses. The bundle is 275 kB on the wire and 86 kB gzipped.
    gzip on;
    gzip_types application/javascript text/css image/svg+xml application/json;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard keeps the owner's API key in sessionStorage, which any script on
    # the page can read. React escapes the values it renders, so that is the first
    # line of defence; this is the second.
    #
    # script-src is what actually stops the attack: an injected script is never run.
    # connect-src and img-src are defence in depth - they close the easy ways to beacon
    # the key out, but not every way: CSP cannot restrain a top-level navigation, so
    # location.href = 'https://…?k=' + key would still get through if a script ran.
    #
    # script-src 'self' would be weak on its own here, because the SPA fallback makes
    # every path serve index.html, so <script src="/anything"> is same-origin. nosniff
    # is what closes that: text/html is refused as executable. The two only work as a
    # pair.
    #
    # No Strict-Transport-Security: TLS ends at Traefik, so this server cannot tell
    # whether the request arrived over HTTPS. HSTS belongs on the Ingress.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.myrelay.tech; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Serve files as the type we declared, instead of guessing from the contents. A
    # guess can turn an uploaded file into an executed script.
    add_header X-Content-Type-Options "nosniff" always;

    # Delivery ids live in the URL, so don't hand them to any site a user clicks to.
    add_header Referrer-Policy "no-referrer" always;

    # No "always" on this one, on purpose. During a rollout both the old and the new
    # pod serve: a client can read the new index.html from one and ask the other for a
    # hashed asset it does not have. With "always" that 404 would carry the one-year
    # immutable header and the dashboard would stay broken for that client until they
    # cleared their cache. Without it, only real 200s are cached.
    add_header Cache-Control $cache_control;

    # React Router owns the URLs, not nginx. A path like /deliveries/abc is not a file
    # on disk, so hand anything that is not a real file to index.html and let the app
    # route it. Without this, reloading a detail screen returns 404.
    #
    # /assets/ is excluded on purpose: a missing script should be a clean 404, not
    # index.html served as JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }
}
