# Serves the built dashboard. Port 8080 because the unprivileged nginx image runs
# as uid 101 and cannot bind a port below 1024.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URLs, not nginx. A path like /deliveries/abc is not a
    # file on disk, so hand anything that is not a real file to index.html and let
    # the app route it. Without this, reloading a detail screen returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every asset filename, so these files never change
    # under the same name and can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the file that points at the hashed
    # assets, so a cached copy would keep serving the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
