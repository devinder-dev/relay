# The pipeline (steps 1.5 and 1.8).
#   Every pull request: test the API and check that its image builds. Nothing is pushed or deployed.
#   Every merge to main: test, build and push the image tagged with the commit, deploy that
#   commit to the VPS, then check from outside that it's live.
# Every merge is a release, so main has no path filter: a deploy needs an image tagged with
# exactly the merged commit, even when only k8s/app/ or the docs changed.
name: pipeline

on:
  pull_request:
    # No path filter here on purpose: "api-test" is a required check, and a required
    # check that never runs (for example on a dashboard-only PR) would block the merge forever.
  push:
    branches: [main]

# By default no job may write anything. Jobs ask for more only where they need it.
permissions:
  contents: read

# A newer push to the same PR cancels the older, now pointless run.
# On main, runs queue up one at a time and never cancel a running deploy. If several merges
# wait, only the newest runs: its commit already contains the others.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: api-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a hung step stops here instead of GitHub's 6-hour default
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned to a full commit SHA, so a moved or hijacked tag can't run new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: api/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # A throwaway Postgres: production's image and first-start script, then the migrations.
      # Started with docker run, not a services: container: those start before checkout, so
      # they can't mount the first-start script from the repo.
      - name: Start the test database
        run: bun run db:up
      - name: Unit and integration tests (logged in as relay)
        run: bun run test:db

  image:
    name: api-image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # only this job may push to GHCR, and it only pushes on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every PR and every merge: build the image into the runner's own Docker, so it can be
      # tested before anything is pushed.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/amd64 # the VPS is amd64; GitHub's runners build that natively
          build-args: GIT_SHA=${{ github.sha }}
          tags: relay-api:smoke
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run the migrations with the image just built, the way the migrate Job runs them
      # (uid 1000, read-only root, no capabilities, its 128 MiB limit), against a throwaway
      # Postgres made by our own first-start script. A dbmate that can't start in the real
      # image is found here, on the PR, instead of halfway through a deploy.
      - name: Smoke-test the migrations inside the image
        shell: bash # GitHub then adds -e and pipefail
        run: |
          # Production's image, read from k8s/data/postgres.yaml (one source of truth). On its own
          # line, so a missing digest stops the step here with a clear message.
          PG_IMAGE=$(bash api/scripts/postgres-image.sh)
          docker network create smoke-net
          docker run -d --name smoke-pg --network smoke-net \
            -e POSTGRES_PASSWORD=test -e RELAY_DB_PASSWORD=test \
            -v "$PWD/k8s/data/initdb:/docker-entrypoint-initdb.d:ro" \
            "$PG_IMAGE"
          for _ in $(seq 1 60); do
            docker exec smoke-pg pg_isready -q -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          migrate() {
            docker run --rm --network smoke-net --read-only --user 1000:1000 --cap-drop ALL --memory 128m \
              -e DATABASE_URL='postgres://relay:test@smoke-pg:5432/relay?sslmode=disable' \
              relay-api:smoke bun run --bun db:migrate
          }
          echo "--- first run: applies every migration"
          migrate
          echo "--- second run: must find nothing to do"
          migrate
          tables=$(docker exec smoke-pg psql -X -U postgres -d relay -Atc \
            "select count(*) from pg_tables where schemaname = 'public' and tablename in
             ('owners', 'api_keys', 'endpoints', 'events', 'deliveries', 'attempts')")
          if [ "$tables" != 6 ]; then
            echo "::error::expected the 6 tables of schema v1, found $tables"
            exit 1
          fi
          docker exec smoke-pg psql -X -U postgres -d relay -Atc \
            "select version from schema_migrations order by version" | sed 's/^/applied: /'
      - name: Smoke-test the signed demo receiver inside the image
        shell: bash
        run: |
          TEST_SIGNING_SECRET="whsec_$(openssl rand -base64 32)"
          docker run -d --name smoke-receiver --network smoke-net --read-only --user 1000:1000 --cap-drop ALL \
            -e DEMO_SIGNING_SECRET="$TEST_SIGNING_SECRET" relay-api:smoke bun src/demo/receiver.ts
          trap 'docker logs smoke-receiver; docker rm -f smoke-receiver >/dev/null' EXIT
          for _ in $(seq 1 30); do
            docker exec smoke-receiver bun -e 'process.exit((await fetch("http://127.0.0.1:8080/health")).ok ? 0 : 1)' && break
            sleep 1
          done
          docker exec smoke-receiver bun -e 'process.exit((await fetch("http://127.0.0.1:8080/health")).ok ? 0 : 1)'
          docker run --rm --network smoke-net --read-only --user 1000:1000 --cap-drop ALL \
            -v "$PWD/api/scripts/receiver-smoke.ts:/tmp/receiver-smoke.ts:ro" \
            relay-api:smoke bun /tmp/receiver-smoke.ts http://smoke-receiver:8080/hooks "$TEST_SIGNING_SECRET"
      # Only after a merge to main: push the same image. Its layers come from the build above
      # (the builder's cache), so this takes seconds and pushes what was just tested.
      - name: Push the image (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/relay-api:${{ github.sha }}
          push: true
          cache-from: type=gha

  dashboard-test:
    name: dashboard-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The dashboard runs on Node and npm, not Bun: decision 0005. The version comes
      # from dashboard/.nvmrc, so CI, Docker and the laptop read it from one file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # "ci", never "install": it installs exactly what package-lock.json names, so CI
      # can never quietly resolve a version the laptop never tested.
      - run: npm ci
      # The runner has no browser. Playwright installs the exact build its own version
      # expects, plus the system libraries Chromium needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      # "build" is tsc -b && vite build, so the type check fails here as its own step
      # instead of being buried in a Docker build log.
      - run: npm run build
      # Playwright starts Vite itself (webServer in playwright.config.ts), so there is
      # no separate "start the app" step.
      - name: End-to-end tests
        run: npm run test:e2e

  dashboard-image:
    name: dashboard-image
    needs: dashboard-test # never pack an image out of code that failed its tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # only on main, in the push step below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every PR and every merge: build into the runner's own Docker, so the image can be
      # tested before anything is pushed. VITE_API_URL is not passed: the Dockerfile's
      # default is already https://api.myrelay.tech.
      # scope=dashboard: the gha cache scope is "buildkit" for everyone by default, so
      # without this the API build and this one would overwrite each other's cache.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dashboard
          platforms: linux/amd64 # the VPS is amd64; GitHub's runners build that natively
          tags: relay-dashboard:smoke
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      # Kubernetes decides a pod is ready by asking for /index.html. An image that
      # cannot answer that would never become ready: the rollout would time out after
      # 180 s and roll the API back with it. So we ask the same question here, on the PR.
      - name: Smoke-test the image
        shell: bash # GitHub then adds -e and pipefail
        run: |
          docker run -d --name smoke-dash -p 127.0.0.1:8099:8080 relay-dashboard:smoke
          # nginx is not up the instant the container is: wait, but not forever.
          for _ in $(seq 1 30); do
            # -fs, not -fsS: a refused connection while nginx starts is expected here,
            # and printing it would look like a failure in a run that went fine.
            curl -fs -o /dev/null http://127.0.0.1:8099/index.html && break
            sleep 1
          done
          # curl -s exits 0 on a 404 too, so every check compares the code itself.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/index.html)
          if [ "$code" != 200 ]; then
            echo "::error::the image did not serve /index.html (HTTP $code)"
            exit 1
          fi
          # Every unknown path returns index.html (the single-page fallback in nginx.conf),
          # so a 200 there proves little on its own. location /assets/ has try_files =404 and
          # no fallback, so asking for the bundle index.html names is what proves the built
          # files are really in the image: an image with an empty assets/ answers 404 here
          # while still answering 200 above.
          asset=$(curl -s http://127.0.0.1:8099/index.html | grep -oE '/assets/[^"]+\.js' | head -n 1)
          if [ -z "$asset" ]; then
            echo "::error::index.html names no built bundle"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$asset")
          if [ "$code" != 200 ]; then
            echo "::error::$asset answered $code: the build is not in the image"
            exit 1
          fi
          echo "the image serves /index.html and $asset"
      # Only after a merge to main: push the same image. Its layers come from the build
      # above (the builder's cache), so this takes seconds and pushes what was tested.
      - name: Push the image (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dashboard
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/relay-dashboard:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=dashboard

  deploy-script:
    name: deploy-script-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # relay-deploy guards production, so its gates and rollback are tested on every PR,
      # with fake git and kubectl (no server needed). shellcheck ships on GitHub's runner.
      - name: Test relay-deploy's decisions
        run: bash infra/server/test-relay-deploy.sh infra/server/relay-deploy.sh
      - name: Lint the shell scripts
        run: shellcheck infra/server/*.sh api/scripts/*.sh

  deploy:
    name: deploy
    # Every image this commit's manifests ask for must be on the shelf before the
    # server is told to pull them, so deploy waits for both image jobs.
    needs: [image, dashboard-image, deploy-script] # a broken deploy script never reaches the server
    if: github.event_name == 'push' # only after a merge to main, never on a PR
    runs-on: ubuntu-24.04
    # The environment hands over DEPLOY_SSH_KEY, and only to workflows running on main.
    environment:
      name: production
      url: https://api.myrelay.tech
    permissions: {} # needs no GitHub access at all: it only talks to our server
    # Four Deployments (API, dashboard, worker, demo receiver), each rollout up to 3 min.
    # Each deploy starts with a migrate Job (up to 3 min); the lock can wait up to 30 min.
    #   success: 30 lock + 3 migrate + 12 rollout + 9 public check       = 54 min
    #   failure: 30 lock + (3 + 12) deploy + (3 + 12) rollback, no check = 60 min
    # Plus 5 minutes for SSH, git, kubectl and job overhead: allow 65 minutes in total.
    timeout-minutes: 65
    steps:
      - name: Deploy the commit over SSH
        # Values arrive as environment variables, never pasted into the command itself.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Our server's ID card: SSH refuses any server that doesn't match it.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs relay-deploy whatever we send, so we send only the commit.
          # Its exit code becomes this step's: a failed or rolled-back deploy turns the job red.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "deploy@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Check that the new version is live
        # relay-deploy already waited for ready pods inside the cluster. This checks the whole
        # public path a customer uses (DNS, certificate, Traefik, Service, pod) from outside.
        # An old pod can still answer for a few seconds after the rollout, and the first deploy
        # also waits for a brand-new certificate. Budget up to 36 × (10 s curl + 5 s sleep)
        # = 9 minutes for retries, plus command overhead.
        shell: bash # GitHub then adds -e and pipefail, so a failed curl isn't hidden behind jq
        run: |
          for attempt in $(seq 1 36); do
            # -f: an error answer (404, 503) counts as a failure. --max-time: never hang.
            live=$(curl -fsS --max-time 10 https://api.myrelay.tech/version | jq -r .sha) \
              || live="no answer"
            echo "attempt $attempt: live is $live"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "$GITHUB_SHA is live"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api.myrelay.tech still doesn't run $GITHUB_SHA after 36 tries"
          exit 1
