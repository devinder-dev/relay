# Postgres 18.6 for Relay (step 2.3): one instance, on a disk that's kept even if its claim is
# deleted (StorageClass local-path-retain, step 2.1).
#
# Applied by hand by one of us, NEVER by the pipeline: the deployer account can't create
# StatefulSets on purpose, so a merged PR can't change the database's version or its disk.
# Order: k8s/platform/storageclass-retain.yaml → infra/server/bootstrap-secrets.sh →
# ConfigMap postgres-init → this file. The ConfigMap is made from the plain script file, so git
# holds only one copy of it:
#   ssh relay 'kubectl --kubeconfig ~/.kube/config -n relay create configmap postgres-init --from-file=10-create-relay.sh=/dev/stdin --dry-run=client -o yaml | kubectl --kubeconfig ~/.kube/config apply -f -' < k8s/data/initdb/10-create-relay.sh
#   ssh relay 'kubectl --kubeconfig ~/.kube/config apply -f -' < k8s/data/postgres.yaml

# The address inside the cluster: postgres.relay.svc.cluster.local:5432.
# Headless (clusterIP: None): DNS answers with the pod's own IP. One pod needs no virtual IP.
# ClusterIP only, never NodePort or LoadBalancer: Postgres must never be reachable from outside
# (namespace relay's Service policy refuses anything else anyway).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: relay
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# StatefulSet: "always exactly one Postgres called postgres-0, and it always gets its own disk
# back". A Deployment's rolling update would start a second Postgres on the same data folder.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: relay
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  # Deleting the StatefulSet or scaling it down never deletes the disk's claim (the default,
  # written out so it's visible).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false   # Postgres never talks to Kubernetes
      enableServiceLinks: false             # no Kubernetes-made POSTGRES_* variables in its env
      # Kubernetes asks Postgres to stop with the image's signal, SIGINT ("fast shutdown": end the
      # connections, write everything to disk, stop: seconds). 60 s is a generous margin before
      # SIGKILL, which would force a crash recovery on the next start.
      terminationGracePeriodSeconds: 60
      # Pod Security "restricted": the image's own postgres user (uid/gid 999), never root.
      # The disk's folder is made world-writable by local-path, so uid 999 can write in it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # 18.6, pinned to its exact bytes: a tag can be pushed again with different contents.
          image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
          # Written out instead of left as the invisible default (also 100): the connection
          # budget (5.1 in the Phase 2 plan) adds up against this number.
          args: ["postgres", "-c", "max_connections=100"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD           # the superuser "postgres" (admins only)
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
            - name: RELAY_DB_PASSWORD           # read once, by the first-start script
              valueFrom:
                secretKeyRef:
                  name: relay-db
                  key: password
          # "May this pod get connections?" Asked over TCP (127.0.0.1), not the local socket:
          # during the very first start a temporary server answers only on the socket, and
          # Postgres would look ready too early.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-t", "2"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # No livenessProbe on purpose: it could kill Postgres in the middle of a long crash
          # recovery, which would then start over, in a loop. A crashed Postgres exits by
          # itself, and Kubernetes restarts it anyway.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi                     # above this the kernel stops Postgres; it recovers on restart
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true        # Postgres may only write to the folders mounted below
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data                        # the database itself (PGDATA is .../18/docker inside it)
              mountPath: /var/lib/postgresql
            - name: init                        # the first-start script, read-only
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: socket                      # Postgres's local socket and lock file
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555                   # executable: runs as its own program, not sourced
        - name: socket
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  # The disk order form: pod postgres-0 gets the claim data-postgres-0 on our Retain class.
  # 10Gi is only a label for local-path, which doesn't enforce sizes.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
