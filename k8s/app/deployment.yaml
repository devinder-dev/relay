# The Relay API (step 1.7). Applied only by the pipeline, through relay-deploy, which
# replaces __GIT_SHA__ with the commit being deployed. Don't apply this file by hand.
#
# Deployment: "keep 2 copies of the API running, and replace them one at a time."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-api
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-api
spec:
  # No `replicas:` on purpose. The autoscaler in k8s/platform/api-hpa.yaml owns the count now
  # (2 to 4 pods, by CPU). Keeping it here as well would mean every deploy overwrote whatever
  # the autoscaler had decided, snapping a busy API back to 2 pods mid-release.
  #
  # READ THIS BEFORE MERGING. `kubectl apply` deletes a field that it applied last time and is
  # missing now, so the first deploy after this merge sets the count to 1 - measured with
  # `apply --dry-run=server -o jsonpath={.spec.replicas}`, which answered 1 while the live
  # Deployment said 2. The autoscaler is what puts it back: it sees 1 < minReplicas and scales
  # to 2 within about 15 s. So k8s/platform/api-hpa.yaml MUST be applied before this is merged,
  # and the pod count checked straight after the first deploy.
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-api   # manage the pods that carry this label...
  # Rolling update: start 1 new pod, wait until it's ready, then stop 1 old one, and repeat.
  # There are never fewer than 2 ready pods, so a deploy drops no requests (VG2).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-api # ...and give every new pod this label
    spec:
      # The API never talks to Kubernetes, so its pods get no ServiceAccount token at all.
      automountServiceAccountToken: false
      # Run as the image's "bun" user. Kubernetes can only check that a user isn't root
      # when it gets a number, so the uid is written out (1000, seen in step 1.4).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault            # the container runtime's default syscall filter
      # From the moment a pod is told to stop, Kubernetes allows this long IN TOTAL, then sends
      # SIGKILL. The 5 s preStop (below) runs first, inside these 30 s; only then comes SIGTERM.
      # So server.ts has the remaining ~25 s: running requests finish (milliseconds for today's
      # routes; later routes must fit too), then the database pool closes (sql.end, at most
      # 5 s). 30 s is the default, written out because of that budget. Phase 4's worker needs
      # more: its webhook calls may take 10 s.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/devinder-dev/relay-api:__GIT_SHA__
          ports:
            - name: http                  # probes, the Service and the Ingress use this name
              containerPort: 8080
          # Where Postgres is, with the relay login in it: straight from the Secret relay-db
          # (made on the server by bootstrap-secrets.sh), never written in git. If the Secret
          # is missing, the pod can't start, so the rollout fails and relay-deploy rolls back.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: relay-db
                  key: url
            # The one operator exception to the SSRF rules (Phase 4): the demo receiver inside the
            # cluster. Exact origin only; customers can't change this list.
            - name: SSRF_ALLOW_ORIGINS
              value: "http://relay-demo-receiver.relay.svc.cluster.local"
          # startup: "has it finished starting?" Runs first, alone; liveness and readiness wait
          # until it has passed once. 45 × 2 s = 90 s: more than the API's own 60 s wait for
          # the database, so the API gives up first, with a clear log line, instead of being
          # killed by the probe in the middle of a retry.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 45
          # readiness: "may this pod get traffic?" No → out of the Service, but kept running.
          # liveness: "is it alive?" No, 3 times → restarted.
          # Neither checks the database: one database blip would take every pod out at once.
          # The API waits for the database before it listens instead (server.ts).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20                 # no initialDelaySeconds: the startupProbe covers the start
            failureThreshold: 3

          # Before SIGTERM, wait 5 s, so Traefik stops sending this pod traffic first.
          # Then server.ts closes the app: running requests finish, new ones get 503.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # requests = guaranteed (the HPA calculates its % from cpu later).
          # limits = the ceiling: above 256 MiB of memory the container is restarted.
          # The 1.3 load test peaked at 93 MB. No CPU limit on purpose: it would slow the API
          # down even when the server has CPU to spare; the request is what scheduling uses.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # nothing in the image can be changed at runtime
            capabilities:
              drop: ["ALL"]
