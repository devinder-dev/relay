# Service: a stable name ("relay-api") inside the cluster for the API pods (step 1.7).
# Pods come and go during a rollout; the Service always points at the ready ones.
apiVersion: v1
kind: Service
metadata:
  name: relay-api
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-api
spec:
  selector:
    app.kubernetes.io/name: relay-api   # the label the Deployment gives its pods
  ports:
    - name: http
      port: 80            # the Service listens on 80...
      targetPort: http    # ...and forwards to the pods' port named "http" (8080)
    # Deliberately not routed by the Ingress. Only Prometheus has a cluster-local path to it.
    - name: metrics
      port: 9090
      targetPort: metrics
---
# The worker has no customer-facing Service. This ClusterIP exists solely so Prometheus can
# scrape its /metrics endpoint; it creates no public route or NodePort.
apiVersion: v1
kind: Service
metadata:
  name: relay-worker-metrics
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-worker
spec:
  selector:
    app.kubernetes.io/name: relay-worker
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
