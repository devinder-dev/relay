# Let's Encrypt issuers for the whole cluster (cert-manager).
# staging: loose rate limits, untrusted certificates. Use while testing.
# prod:    trusted certificates, strict rate limits. Use once staging works.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key   # our Let's Encrypt account key, created by cert-manager
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik          # prove domain ownership through Traefik on port 80
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
