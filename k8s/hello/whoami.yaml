# Temporary test app for step 0.13: proves DNS -> firewalls -> Traefik -> HTTPS -> pod.
# traefik/whoami answers every request with details about the request and which pod served it.
# Replaced by the real API in Phase 2 (step 2.7).

# Deployment: "keep 1 copy of the whoami container running, and restart it if it dies."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello            # manage the pods that carry this label...
  template:
    metadata:
      labels:
        app: hello          # ...and give every new pod this label
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0   # pinned version, never "latest"
          ports:
            - containerPort: 80
---
# Service: a stable name ("hello") inside the cluster that sends traffic to the pods labelled app=hello.
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - port: 80              # the Service listens on 80...
      targetPort: 80        # ...and forwards to port 80 in the pod
---
# Ingress: expose the Service to the outside world.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod 
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.myrelay.tech
      secretName: api-myrelay-tech-tls
  rules:
    - host: api.myrelay.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
