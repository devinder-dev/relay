# Values for loki 20.2.2, read back with `helm get values loki -n monitoring`.
#
# Monolithic mode with one replica and filesystem storage: a single-node VPS has no object
# store and no second node to spread over, so the scalable modes would add parts without
# adding safety.
#
# Why these choices:
#
# 72 hours: logs are for debugging what just happened - the last deploy, a worker's retry cycle -
# and three days covers a weekend. Keeping less also means keeping less customer data (request
# paths with ids, delivery details), and it stays well inside the 5Gi volume.
#
# Caches and canary off: the chart's default chunks cache is a memcached with
# `allocatedMemory: 8192`, i.e. 8 GB - the whole VPS. With one node and little log volume the
# caches would cost memory for no speed-up. The canary writes and reads synthetic log lines to
# measure Loki itself: useful in a large installation, noise here.
#
# If this volume is lost, the logs are gone. Loki and Prometheus both use the default `local-path`
# StorageClass, which is deleted with its claim, unlike Postgres's `local-path-retain`, and neither
# is backed up. That is deliberate: logs and metrics are operational history, while the database is
# the data we have to keep.

backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    retention_period: 72h
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  replicas: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 128Mi
test:
  enabled: false
write:
  replicas: 0
