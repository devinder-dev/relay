# Values for loki 20.2.2, read back with `helm get values loki -n monitoring`.
#
# Monolithic mode with one replica and filesystem storage: a single-node VPS has no object
# store and no second node to spread over, so the scalable modes would add parts without
# adding safety.
#
# TODO(Devinder): for the defense -
#   - why 72 hours of log retention
#   - why the caches and the canary are disabled
#   - what happens to logs if this pod's volume is lost (no backup today?)

backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    retention_period: 72h
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  replicas: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 128Mi
test:
  enabled: false
write:
  replicas: 0
