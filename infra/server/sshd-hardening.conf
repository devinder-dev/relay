# SSH hardening (step 0.6). Installed as /etc/ssh/sshd_config.d/00-hardening.conf.
# sshd reads these files in alphabetical order and keeps the FIRST value it sees, so "00-"
# makes ours win over one.com's 50-cloud-init.conf, which turns passwords on.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
